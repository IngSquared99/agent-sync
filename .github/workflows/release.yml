# Release pipeline: triggered automatically by pushing a v-prefixed tag
# (e.g. v0.1.0). Tests run first; a failed test run publishes nothing.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # allow creating the Release and uploading assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (tag kept as a comment): this workflow holds
      # write credentials — GITHUB_TOKEN with contents:write plus the
      # Homebrew-tap PAT — so a repointed action tag would be a supply-chain
      # hole. Dependabot keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0    # goreleaser needs full history for the changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false      # zero-dependency project: no go.sum, nothing to cache

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
