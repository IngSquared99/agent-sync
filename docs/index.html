<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>agsy 說明文件 | agsy Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="agsy（agent-sync）— 多來源 AI 指令檔的合併與掛載工具 | merge & mount tool for multi-source AI instruction files">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #2563eb; }
    .sidebar-nav strong { display: block; margin: 12px 0 4px; color: #505d6b; font-size: 13px; }
    .markdown-section code { font-size: .85em; }
    .markdown-section pre { line-height: 1.55; }
  </style>
</head>
<body>
  <div id="app">載入中… / Loading…</div>
  <script>
    window.$docsify = {
      name: 'agsy',
      repo: 'IngSquared99/agent-sync',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      coverpage: true,
      auto2top: true,
      alias: {
        '/_sidebar.md': '/zh-TW/_sidebar.md'
      },
      fallbackLanguages: ['zh-TW', 'en'],
      search: {
        placeholder: { '/en/': 'Search…', '/': '搜尋文件…' },
        noData: { '/en/': 'No results', '/': '找不到結果' },
        depth: 3,
        pathNamespaces: ['/zh-TW', '/en']
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
