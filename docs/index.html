<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>agent-sync (agsy) — AI 指令文件的單一來源同步工具</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="把散落多處的 rules / skills / workflows 合併成一份產物，掛載給 Claude Code、Antigravity 等 AI 工具。改一份來源，所有工具同步生效。">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #2f6fed; }
    .markdown-section pre > code { font-size: 13px; line-height: 1.5; }
    .markdown-section { max-width: 62em; }
    .sidebar-nav li > a { font-size: 14px; }
    .cover.show { background: linear-gradient(to bottom right, #eef4ff 0%, #f7fbff 100%) !important; }
  </style>
</head>
<body>
  <div id="app">載入中…</div>
  <script>
    window.$docsify = {
      name: 'agent-sync',
      repo: 'https://github.com/IngSquared99/agent-sync',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      notFoundPage: true,
      search: {
        placeholder: '搜尋文件…',
        noData: '找不到結果',
        depth: 3,
      },
      copyCode: {
        buttonText: '複製',
        successText: '已複製',
      },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
