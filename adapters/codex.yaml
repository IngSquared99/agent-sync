# OpenAI Codex mount preset
# Codex reads project rules from the root AGENTS.md, skills (including
# converted workflows) from .agents/skills/, and hooks from .codex/hooks.json.
name: codex
display: OpenAI Codex
needs_agents_md: true
mounts:
  - dir: .agents
    links:
      skills: skills
  - dir: .codex
    links:
      hooks.json: hooks.codex.json
