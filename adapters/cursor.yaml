# Cursor mount preset
# Cursor reads rules from the root AGENTS.md, skills (including converted
# workflows) natively from .agents/skills/, so it shares the .agents mount;
# hooks come from .cursor/hooks.json.
name: cursor
display: Cursor
needs_agents_md: true
mounts:
  - dir: .agents
    links:
      skills: skills
  - dir: .cursor
    links:
      hooks.json: hooks.cursor.json
