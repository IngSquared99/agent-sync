# goreleaser release config
# Purpose: invoked by GitHub Actions on tag push; cross-compiles six
# platform builds and uploads them to Releases.
# Local dry run (no publish): goreleaser release --snapshot --clean
version: 2

project_name: agsy

before:
  hooks:
    - go test ./...

builds:
  - binary: agsy            # explicit binary name (don't default to the repo name agent-sync)
    main: ./cmd/agsy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  # No version in file names: keeps releases/latest/download/<name> as a
  # permanent URL, so the one-line curl install in the README never needs
  # updating. Versions are visible in checksums.txt and `agsy version`.
  # Names use plain words (mac_apple_silicon / mac_intel / windows_x64 ...)
  # instead of GOOS/GOARCH jargon.
  - name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}mac{{- else }}{{ .Os }}{{ end }}_
      {{- if and (eq .Os "darwin") (eq .Arch "arm64") }}apple_silicon
      {{- else if and (eq .Os "darwin") (eq .Arch "amd64") }}intel
      {{- else if eq .Arch "amd64" }}x64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]      # Windows users expect zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap: on each release goreleaser pushes an updated cask to
# IngSquared99/homebrew-tap, so users can `brew install IngSquared99/tap/agsy`.
# One-time setup: create the public repo "homebrew-tap", then add a PAT with
# write access to it as the HOMEBREW_TAP_GITHUB_TOKEN Actions secret.
homebrew_casks:
  - name: agsy
    repository:
      owner: IngSquared99
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/IngSquared99/agent-sync
    description: "Sync AI rules to every tool"
    # The binary is not signed/notarized. Drop the macOS quarantine flag at
    # install time (the approach recommended by the goreleaser docs) so
    # Gatekeeper does not block the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agsy"]
          end
